<?xml version="1.0" encoding="UTF-8"?>
<!--
  pagebin — square mark (simplified for favicon / <32px contexts)
  Three elements only: page with folded corner + bin tray + 2 text strokes (not 4).
  Bigger corner fold so the page motif survives at 16x16.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="pagebin">
  <title>pagebin</title>
  <defs>
    <linearGradient id="binG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#binG2)"/>
  <!-- page with bigger folded corner (corner triangle ~1/3 of the page width so it survives downscale) -->
  <g transform="translate(128 112)">
    <path d="M0 0 H180 L256 80 V256 H0 Z" fill="#FFFFFF"/>
    <!-- folded corner back (darker facet) -->
    <path d="M180 0 L256 80 H180 Z" fill="#C7CCD8"/>
    <!-- subtle crease line at the fold -->
    <path d="M180 0 V80 H256" fill="none" stroke="#9098AB" stroke-width="6" stroke-linejoin="round" opacity="0.55"/>
    <!-- just two text strokes so the page still reads as a page at 16x16 -->
    <rect x="28" y="132" width="180" height="14" rx="7" fill="#6366F1" opacity="0.85"/>
    <rect x="28" y="172" width="120" height="14" rx="7" fill="#6366F1" opacity="0.6"/>
  </g>
  <!-- the bin tray sits at bottom-front -->
  <g transform="translate(96 360)">
    <path d="M0 24 L32 56 H288 L320 24 V12 H0 Z" fill="#3730A3"/>
    <rect x="0" y="6" width="320" height="10" rx="5" fill="#818CF8" opacity="0.85"/>
  </g>
</svg>
