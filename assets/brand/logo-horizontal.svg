<?xml version="1.0" encoding="UTF-8"?>
<!--
  pagebin — horizontal lockup (mark + wordmark, 5:1 ish)
  Clear-space = 1x the cap-height of the wordmark on every side.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" role="img" aria-label="pagebin">
  <title>pagebin</title>
  <defs>
    <linearGradient id="pageGradH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8ECF2"/>
    </linearGradient>
    <linearGradient id="binGradH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="curlGradH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8DEE9"/>
      <stop offset="1" stop-color="#A8B0BF"/>
    </linearGradient>
  </defs>

  <!-- the mark, scaled down inside the horizontal canvas -->
  <g transform="translate(32 32) scale(0.375)">
    <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#binGradH)"/>
    <rect x="96" y="312" width="320" height="24" rx="12" fill="#312E81" opacity="0.55"/>
    <g transform="translate(140 128)">
      <path d="M0 0 H196 L260 64 V240 H0 Z" fill="url(#pageGradH)"/>
      <path d="M196 0 L260 64 H196 Z" fill="url(#curlGradH)"/>
      <path d="M196 0 V64 H260" fill="none" stroke="#7B8395" stroke-width="3" stroke-linejoin="round" opacity="0.5"/>
      <g fill="#6366F1" opacity="0.55">
        <rect x="24" y="104" width="160" height="10" rx="5"/>
        <rect x="24" y="136" width="200" height="10" rx="5"/>
        <rect x="24" y="168" width="120" height="10" rx="5"/>
        <rect x="24" y="200" width="170" height="10" rx="5"/>
      </g>
    </g>
    <g transform="translate(96 336)">
      <path d="M0 24 L32 56 H288 L320 24 V16 H0 Z" fill="#4338CA"/>
      <rect x="0" y="12" width="320" height="8" rx="4" fill="#7C7BF3" opacity="0.7"/>
    </g>
  </g>

  <!-- wordmark: rendered as text on a system stack with a tightened fallback web font; the symbol stays crisp via SVG regardless of font. -->
  <g font-family="'Inter','SF Pro Text','Segoe UI',Roboto,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-weight="700" letter-spacing="-2">
    <text x="260" y="172" font-size="148" fill="#1F2937">page</text>
    <text x="500" y="172" font-size="148" fill="#6366F1">bin</text>
  </g>

  <!-- tagline -->
  <g font-family="'Inter','SF Pro Text','Segoe UI',Roboto,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-weight="500">
    <text x="260" y="206" font-size="30" fill="#6B7280" letter-spacing="0.4">Share a page. Skip the paste.</text>
  </g>
</svg>
